<!doctype html>
<html lang="en-AU" data-theme="navy" data-page="parking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melbourne Parking · Find your next spot</title>
    <meta
      name="description"
      content="Live on-street parking availability for the City of Melbourne, built on council sensor open data. Shows how fresh the data is before it shows a number."
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f6fa" />
    <script>
      // Apply the shared preference before styles paint either Pages app.
      (() => {
        let theme = "navy";
        try { if (localStorage.getItem("melbourne-collection:theme") === "light") theme = "light"; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "navy" ? "#2c241b" : "#f7f6fa";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://data.melbourne.vic.gov.au" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700;750&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
